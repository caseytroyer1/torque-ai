<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Torque AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #060f1e;
            color: #B8C5D6;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(6,15,30,0.97);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            height: 72px;
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 0 48px;
        }
        nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #B8C5D6;
            font-size: 14px;
            transition: color 0.2s;
        }
        nav a:hover { color: #fff; }
        .nav-logo {
            height: 50px;
            width: auto;
        }
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 24px 60px;
            text-align: center;
        }
        .inner { max-width: 480px; }
        .error-num {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 120px;
            font-weight: 700;
            color: #1e5eff;
            letter-spacing: -6px;
            line-height: 1;
            opacity: 0.15;
            margin-bottom: -20px;
        }
        .error-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.8px;
            margin-bottom: 14px;
        }
        .error-sub {
            font-size: 15px;
            color: #7a90b0;
            line-height: 1.6;
            margin-bottom: 36px;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1e5eff;
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            padding: 14px 32px;
            border-radius: 50px;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s;
        }
        .btn-home:hover { background: #3d7aff; color: #fff; }
        .divider-line {
            width: 48px;
            height: 2px;
            background: #1e5eff;
            margin: 0 auto 32px;
            border-radius: 2px;
            opacity: 0.5;
        }
        footer {
            background: #060f1e;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding: 28px 24px;
            text-align: center;
            font-size: 13px;
            color: #4a6080;
        }
        footer a { color: #1e5eff; margin: 0 10px; text-decoration: none; }
        footer a:hover { color: #3d7aff; }
        @media (max-width: 600px) {
            nav { padding: 0 20px; }
            .error-num { font-size: 80px; }
            .error-title { font-size: 26px; }
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html">
        <img src="torque-logo.svg" alt="Torque" class="nav-logo">
    </a>
</nav>

<div class="main">
    <div class="inner">
        <div class="error-num">404</div>
        <div class="error-title">Page Not Found</div>
        <div class="divider-line"></div>
        <p class="error-sub">Looks like this page took a wrong turn on the back nine. Let's get you back on the fairway.</p>
        <a href="index.html" class="btn-home">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            Back to Torque AI
        </a>
    </div>
</div>

<footer>
    <div>© 2026 Torque AI</div>
    <div style="margin-top:10px;">
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Service</a>
    </div>
</footer>

</body>
</html>
